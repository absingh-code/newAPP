# project.yml
# XcodeGen spec.
#
# Re-enabled the custom LaunchScreen.storyboard (navy background, SF
# Symbol badge, team name, accent bar). Also added NSFaceIDUsageDescription
# for the new Face ID app-lock feature.

name: FTCTeamHub
options:
  bundleIdPrefix: com.ftcteamhub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0

targets:
  FTCTeamHub:
    type: application
    platform: iOS
    sources:
      - path: FTCTeamHub
    resources:
      - path: FTCTeamHub/GoogleService-Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ftcteamhub.app
        PRODUCT_NAME: FTCTeamHub
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: FTCTeamHub/Info.plist
      properties:
        CFBundleDisplayName: FTC Team Hub
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: "FTC Team Hub uses the camera to scan QR labels on inventory items for quick check-in and check-out."
        NSFaceIDUsageDescription: "FTC Team Hub uses Face ID to keep team data private."

schemes:
  FTCTeamHub:
    build:
      targets:
        FTCTeamHub: all
    archive:
      config: Release
